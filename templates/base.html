<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .flash-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            min-width: 300px;
        }
        .flash-message {
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            animation: fadeOut 0.5s ease-in-out 3s forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }
        .navbar {
            background-color: #28a745 !important;
        }
        .logout-btn {
            color: white;
            border-color: white;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
            color: white !important;
        }
        .attendance-status {
            display: inline-flex;
            border: 2px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .attendance-option {
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            border: none;
            outline: none;
        }
        .attendance-option.present {
            color: #28a745;
        }
        .attendance-option.absent {
            color: #dc3545;
        }
        .attendance-option.present.selected {
            background: #28a745;
            color: white;
        }
        .attendance-option.absent.selected {
            background: #dc3545;
            color: white;
        }
        .alert {
            transition: opacity 0.5s ease-in-out;
        }
        .alert.fade-out {
            opacity: 0;
        }
        .user-type-selector {
            display: flex;
            border: 2px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .user-type-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            border: none;
            outline: none;
        }
        .user-type-option.selected {
            background: #28a745;
            color: white;
        }

        /* Responsive styles for attendance buttons */
        @media (max-width: 576px) {
            .attendance-option {
                padding: 6px;
                width: 40px;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .attendance-option span {
                display: none;
            }
            .attendance-option i {
                margin: 0 !important;
                font-size: 1.2em;
            }
            .table td {
                padding: 0.5rem;
            }
            .table th {
                padding: 0.5rem;
                font-size: 0.9em;
            }
            .attendance-status {
                min-width: unset;
                display: flex;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-clipboard-check me-2"></i>
                Attendance System
            </a>
            {% if session.get('user_id') %}
            <div class="ms-auto">
                <a href="{{ url_for('logout') }}" class="btn logout-btn btn-outline-light">
                    <i class="fas fa-sign-out-alt me-1"></i>
                    Logout
                </a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="flash-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message alert alert-{{ category if category != 'message' else 'info' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
